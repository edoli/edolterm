[package]
name = "edolterm"
version = "0.1.0"
edition = "2024"
description = "A GPUI terminal with Alacritty's terminal core"
license = "Apache-2.0"

[features]
ui-tests = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
anyhow = "1"
alacritty_terminal = "0.26"
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "b5cd310b3b54dfc659fcc06453e6358843dfe216", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "b5cd310b3b54dfc659fcc06453e6358843dfe216", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
async-channel = "2"
base64 = "0.22"
url = "2"
polling = "3"
unicode-width = "0.2"
unicode-segmentation = "1"

[target.'cfg(target_os = "windows")'.dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "b5cd310b3b54dfc659fcc06453e6358843dfe216", default-features = false, features = ["windows-manifest"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "b5cd310b3b54dfc659fcc06453e6358843dfe216", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "b5cd310b3b54dfc659fcc06453e6358843dfe216", default-features = false, features = ["font-kit"] }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

